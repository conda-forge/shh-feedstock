context:
  version: "2026.3.8"

package:
  name: shh
  version: ${{ version }}

source:
  url: https://github.com/desbma/shh/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2d294e583ccc742095cc211080fb1c4c8b095dd4b30b98d116d36acbb4b5e1b6

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - ^cargo auditable install --path=. --root=($prefix) --no-track --locked --bins --features=generate-extras
      - ^cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions and manpages
      - if: build_platform == host_platform
        then:
          - ^shh gen-shell-completions --shell=bash | save --force ($prefix)/share/bash-completion/completions/shh
          - ^shh gen-shell-completions --shell=fish | save --force ($prefix)/share/fish/vendor_completions.d/shh.fish
          - ^shh gen-shell-completions --shell=zsh  | save --force ($prefix)/share/zsh/site-functions/_shh
          - ^shh gen-man-pages                                     ($prefix)/share/man/man1
  skip:
    - not linux

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell
  host:
    - strace

tests:
  - script:
      - shh --help
      - shh --version
    requirements:
      run:
        - strace
  - package_contents:
      bin:
        - shh
      files:
        - share/man/man1/shh*.1
        - share/bash-completion/completions/shh
        - share/fish/vendor_completions.d/shh.fish
        - share/zsh/site-functions/_shh
      strict: true

about:
  summary: Automatic systemd service hardening guided by strace profiling
  description: |
    Systemd Hardening Helper (SHH) can generate an optimal set of hardening
    options for systemd services. It profiles service behavior using strace and
    automatically generates appropriate systemd security options, enabling
    security hardening without breaking services due to overly restrictive
    sandboxing.
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/desbma/shh
  repository: https://github.com/desbma/shh

extra:
  recipe-maintainers:
    - salim-b
